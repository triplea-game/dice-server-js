# Throwaway stack for `just e2e`: the production image against a tmpfs
# Postgres and Mailpit. Host ports are ephemeral and `just e2e` gives each run
# its own project, so concurrent runs don't collide with each other or `just run`.

services:
  app:
    build: ../..
    ports:
      - "7654"
    # tini as PID 1, so a stop signal reaches node instead of being ignored
    # and the container is not SIGKILLed after the stop grace period.
    init: true
    volumes:
      - ./config.json:/app/config.json:ro
      - ./.keys:/app/keys:ro
    environment:
      - DB_PASSWORD=e2e
    healthcheck:
      # node:22-slim has no curl or wget. No spaces in the script: rootless
      # Podman re-splits exec-form healthcheck arguments on whitespace.
      test: ["CMD", "node", "-e", "fetch('http://localhost:7654/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025"
      - "1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:16
    ports:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: dicedb
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
