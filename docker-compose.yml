services:
  app:
    build: .
    ports:
      - "7654:7654"
    # tini as PID 1, so a stop signal reaches node instead of being ignored
    # and the container is not SIGKILLed after the stop grace period.
    init: true
    volumes:
      - ./config.json:/app/config.json:ro
      - ./keys:/app/keys:ro
    environment:
      - DB_PASSWORD=change-me
    healthcheck:
      # No spaces in the script: rootless Podman re-splits exec-form arguments.
      test: ["CMD", "node", "-e", "fetch('http://localhost:7654/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit
    # SMTP gets an ephemeral localhost port for 'just dev', which looks it up.
    ports:
      - "8025:8025"
      - "127.0.0.1::1025"
    restart: unless-stopped
  postgres:
    image: postgres:16
    # An ephemeral localhost port for 'just dev', which looks it up.
    ports:
      - "127.0.0.1::5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: dicedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  pgdata:
