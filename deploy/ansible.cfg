# For example with defaults:
# https://raw.githubusercontent.com/ansible/ansible/devel/examples/ansible.cfg

[inventory]
enable_plugins = community.general.linode, host_list, script, auto, yaml, ini, toml

[defaults]
forks = 10
gathering = explicit
callback_result_format = yaml
# timeout updates the value of ansible_ssh_timeout, default is 10
timeout = 30

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
retries = 10
# Pin the host key on first contact and refuse a changed one afterwards. On the
# throwaway CI runner every run is a first contact, so this only bites for a
# 'just deploy' run from a maintainer's machine; matches the infrastructure repo.
# Keepalives stop NAT idle timeouts from dropping the session while
# deploy-marti.sh waits silently on the app's healthcheck.
ssh_extra_args = -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=4
